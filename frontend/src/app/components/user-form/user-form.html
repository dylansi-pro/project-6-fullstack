<div class="container mt-4">
  <h2>{{ isEditMode ? 'Edit User' : 'Add User' }}</h2>

  <form (ngSubmit)="saveUser()">
    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" class="form-control" [(ngModel)]="user.firstName" name="firstName" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" class="form-control" [(ngModel)]="user.lastName" name="lastName" required>
    </div>

    <div class="mb-3">
      <label class="form-label">User Type</label>
      <select class="form-select" [(ngModel)]="user.userType" name="userType" required>
        @for (type of userTypes; track type.id) {
          <option [ngValue]="type">{{ type.type }}</option>
        }
      </select>
    </div>

    <button type="submit" class="btn btn-success me-2">Save</button>
    <a routerLink="/users" class="btn btn-secondary">Cancel</a>
  </form>
</div>
