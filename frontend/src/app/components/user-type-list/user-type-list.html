<div class="container mt-4">
  <h2>User Type List</h2>

  <div class="mb-3">
    <a routerLink="/user-types/add" class="btn btn-primary">Add User Type</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Type</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
      @for (tempType of userTypes; track tempType.id) {
        <tr>
          <td>{{ tempType.id }}</td>
          <td>{{ tempType.type }}</td>
          <td>
            <a [routerLink]="['/user-types/edit', tempType.id]" class="btn btn-warning btn-sm me-2">Edit</a>
            <button (click)="tempType.id && deleteUserType(tempType.id)" class="btn btn-danger btn-sm">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="text-center">No User Type Found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
