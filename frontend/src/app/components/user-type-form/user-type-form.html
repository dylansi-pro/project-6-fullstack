<div class="container mt-4">
  <h2>{{ isEditMode ? 'Edit User Type' : 'Add User Type' }}</h2>

  <form (ngSubmit)="saveUserType()" #userTypeForm="ngForm">
    <div class="mb-3">
      <label class="form-label">Type Name *</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="userType.type"
        name="type"
        #typeName="ngModel"
        required
        pattern=".*\S+.*"
        [ngClass]="{'is-invalid': typeName.invalid && (typeName.dirty || typeName.touched)}">
      <div class="invalid-feedback">
        Type name is required and cannot be empty spaces.
      </div>
    </div>

    <button type="submit" class="btn btn-success me-2" [disabled]="userTypeForm.invalid">Save</button>
    <a routerLink="/user-types" class="btn btn-secondary">Cancel</a>
  </form>
</div>
