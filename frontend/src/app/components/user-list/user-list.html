<table class="table table-striped table-bordered">
  <thead class="table-dark">
  <tr>
    <th>ID</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>User Type</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
    @for (tempUser of users; track tempUser.id) {
      <tr>
        <td>{{ tempUser.id }}</td>
        <td>
          <a [routerLink]="['/users/detail', tempUser.id]">{{ tempUser.firstName }}</a>
        </td>
        <td>{{ tempUser.lastName }}</td>
        <td>{{ tempUser.userType?.type }}</td>
        <td>
          <a [routerLink]="['/users/edit', tempUser.id]" class="btn btn-warning btn-sm me-2">Edit</a>
          <button (click)="tempUser.id && deleteUser(tempUser.id)" class="btn btn-danger btn-sm">Delete</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="text-center">No User Found.</td>
      </tr>
    }
  </tbody>
</table>
