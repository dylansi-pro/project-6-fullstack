version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: profile_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: profile_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: profile_backend
    restart: always
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: profile_frontend
    restart: always
    ports:
      - "4200:80"
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge